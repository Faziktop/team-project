<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="100%" stop-color="#FFE0B2" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F5F5" />
    </linearGradient>
    <filter id="plateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#D7CCC8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Plate -->
  <circle cx="400" cy="280" r="180" fill="url(#plateGrad)" filter="url(#plateShadow)"/>
  <circle cx="400" cy="280" r="140" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="3"/>
  <circle cx="400" cy="280" r="110" fill="#FFF8E1" stroke="#FFE082" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Cloche / Food Dome Icon -->
  <path d="M400 190c-55 0-100 40-100 90h200c0-50-45-90-100-90z" fill="#FF8A65" opacity="0.9"/>
  <circle cx="400" cy="180" r="12" fill="#E64A19"/>
  <rect x="290" y="280" width="220" height="12" rx="6" fill="#D84315"/>

  <!-- Fork and Knife decorations -->
  <path d="M210 200v160m-15-160v60c0 15 15 25 15 25m15-85v60c0 15-15 25-15 25" stroke="#BCAAA4" stroke-width="6" stroke-linecap="round"/>
  <path d="M590 200v160c0 0 20-30 20-80v-80h-20z" fill="#BCAAA4" stroke="#BCAAA4" stroke-width="4" stroke-linejoin="round"/>

  <!-- Text -->
  <text x="400" y="500" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="700" fill="#5D4037">
    Вкусное блюдо
  </text>
  <text x="400" y="535" text-anchor="middle" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#8D6E63">
    Фото скоро появится
  </text>
</svg>
