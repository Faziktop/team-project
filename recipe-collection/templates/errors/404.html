{% extends "base.html" %}

{% block title %}Страница не найдена (404) — Recipe Collection{% endblock %}

{% block content %}
<div class="container" style="padding: 100px 24px; text-align: center;">
    <div style="font-size: 5rem; color: var(--primary); font-weight: 800; line-height: 1; margin-bottom: 20px;">404</div>
    <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 12px;">Рецепт или страница не найдены</h1>
    <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 32px;">
        Кажется, это блюдо уже съели или адрес был введен с ошибкой.
    </p>
    <div style="display: flex; justify-content: center; gap: 16px;">
        <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> В каталог рецептов
        </a>
    </div>
</div>
{% endblock %}
