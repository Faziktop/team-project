{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Филиалы</h2>
  <a href="{{ url_for('admin.branch_new') }}" class="btn btn-primary">+ Филиал</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Название</th><th>Город</th><th>Адрес</th><th>Телефон</th><th>Активен</th></tr></thead>
  <tbody>
  {% for b in items %}
    <tr><td>{{ b.name }}</td><td>{{ b.city or '—' }}</td><td>{{ b.address or '—' }}</td><td>{{ b.phone or '—' }}</td>
        <td>{{ 'Да' if b.is_active else 'Нет' }}</td></tr>
  {% else %}
    <tr><td colspan="5" class="text-muted">Филиалов пока нет</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
