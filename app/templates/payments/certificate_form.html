{% extends "base.html" %}
{% from "macros/forms.html" import field %}
{% block content %}
<h2>Новый сертификат</h2>
<form method="post" novalidate class="col-md-6">
  {{ form.hidden_tag() }}
  {{ field(form.code) }}{{ field(form.initial_balance) }}{{ field(form.expires_at) }}{{ field(form.issued_to_name) }}
  <button class="btn btn-primary">Создать</button>
</form>
{% endblock %}
